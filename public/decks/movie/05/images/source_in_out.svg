<text x="380.0" y="262" text-anchor="end" font-size="19" fill="#ffd166">止めを0.5秒残してイン</text>
<text x="799.6" y="262" font-size="19" fill="#ffd166">止めを0.5秒残してアウト</text>
<path d="M589.8,240 L589.8,350" stroke="#E8833A" stroke-width="6"/>
