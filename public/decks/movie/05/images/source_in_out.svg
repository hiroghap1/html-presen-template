<line x1="411.2" y1="410" x2="411.2" y2="486" stroke="#9fb34a" stroke-width="2" stroke-dasharray="6 6"/>
<line x1="768.4" y1="410" x2="768.4" y2="486" stroke="#9fb34a" stroke-width="2" stroke-dasharray="6 6"/>
<line x1="1125.7" y1="410" x2="1125.7" y2="486" stroke="#9fb34a" stroke-width="2" stroke-dasharray="6 6"/>
<rect x="130" y="420" width="279.2" height="56" rx="6" fill="#5b5fc7"/><text x="261.2" y="455" font-size="19" fill="#fff" text-anchor="end">看板_アップ</text>
<rect x="413.2" y="420" width="353.3" height="56" rx="6" fill="#5b5fc7" stroke="#E8833A" stroke-width="4"/><text x="425.2" y="455" font-size="19" fill="#fff">駄菓子の棚_パン</text>
<text x="589.8" y="510" text-anchor="middle" font-size="19" fill="#ddd">インからアウトまでの約3秒だけが置かれる（1小節）</text>
