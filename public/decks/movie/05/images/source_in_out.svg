<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, sans-serif">
<rect width="1400" height="560" fill="#1e1e1e"/>
<text x="120" y="34" font-size="24" fill="#fff" font-weight="bold">ソースモニター：駄菓子の棚_パン（10秒）</text>
<rect x="120.0" y="80" width="348.0" height="70" fill="#4a6b8a"/>
